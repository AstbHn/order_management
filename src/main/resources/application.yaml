spring:
  application:
    name: order
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:**/*.xml
  type-aliases-package: com.astb.order.domain

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"

server:
  port: 9787