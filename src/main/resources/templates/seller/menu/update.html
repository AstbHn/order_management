<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>음식점 주문[점주]</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div id="page-wrap">
  <h2>메뉴 수정</h2>
  <table>
    <thead>
    <tr>
      <th>번호</th>
      <th>메뉴명</th>
      <th>가격</th>
      <th colspan="2">관리</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="menu : ${menuList}">
      <form th:action="@{/seller/update}" method="post">
        <input type="hidden" name="storeId" th:value="${menu.storeId}">
        <td><input type="text" name="menuId" th:value="${menu.menuId}" readonly/></td>
        <td><input type="text" name="name" th:value="${menu.name}" required/></td>
        <td><input type="number" name="price" th:value="${menu.price}" required/></td>
        <td><button type="submit" name="action" value="update"> 수정 </button></td>
        <td>
          <button type="submit" name="action" value="delete" th:if="${menu.active}"> 삭제 </button>
          <button type="submit" name="action" value="active" th:unless="${menu.active}"> 재개시 </button>
        </td>
      </form>
    </tr>
    </tbody>
  </table>
  <a th:href="@{/seller/home}">메인으로</a>
</div>
</body>
</html>
