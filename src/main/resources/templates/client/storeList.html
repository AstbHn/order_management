<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>음식점 주문[고객]</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div id="page-wrap">

  <h2 th:text="${category} + ' 가게 목록'"></h2>
  <ul>
    <li th:each="store : ${stores}">
      <a th:href="@{/client/order(storeId=${store.storeId})}"
         th:text="${store.name}"></a>
    </li>
  </ul>
  <a th:href="@{/client/home}">메인으로</a>
</div>
</body>
</html>
